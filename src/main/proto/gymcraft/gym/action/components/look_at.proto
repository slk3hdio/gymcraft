syntax = "proto3";

package gymcraft.gym.action;

option java_multiple_files = true;
option java_package = "io.github.mousemeya.gymcraft.gym.action.proto";
option java_outer_classname = "LookAtProto";

// 方块视线目标，以方块中心作为注视点。
message ProtoLookAtBlockTarget {
  int32 x = 1;
  int32 y = 2;
  int32 z = 3;
}

// 实体视线目标，接受任意已加载实体；普通实体注视眼睛，掉落物注视包围盒中心。
message ProtoLookAtEntityTarget {
  int32 entity_id = 1;
}

// Agent 自身物品栏槽位查询目标；只读返回物品描述，不移动视线。
message ProtoLookAtSlotTarget {
  int32 slot_id = 1;
}

// 将 Agent 当前视线瞬时对准一个已加载目标，或查询自身物品栏槽位。
message ProtoLookAt {
  reserved 2;
  oneof target {
    ProtoLookAtEntityTarget entity = 1;
    ProtoLookAtBlockTarget block = 3;
    ProtoLookAtSlotTarget slot = 4;
  }
}
