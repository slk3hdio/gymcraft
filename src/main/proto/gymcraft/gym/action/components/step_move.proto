syntax = "proto3";

package gymcraft.gym.action;

option java_multiple_files = true;
option java_package = "io.github.mousemeya.gymcraft.gym.action.proto";
option java_outer_classname = "StepMoveProto";

message ProtoStepMove {
  float forward = 1;
  float strafe_right = 2;
  float yaw_delta = 3;
  float pitch_delta = 4;
  bool jump = 5;
}
