syntax = "proto3";

package gymcraft.gym.action;

option java_multiple_files = true;
option java_package = "io.github.mousemeya.gymcraft.gym.action.proto";
option java_outer_classname = "StepMoveProto";

message ProtoStepMove {
  float forward = 1;
  float strafe_right = 2;
  float yaw_delta = 3;
  // 4 曾为 pitch_delta：26.1 原版 LookControl 每次 AI tick 复位无注视目标 Mob
  // 的 pitch，增量写入会被立即覆盖，字段已移除（需要精确俯仰用 look_at）。
  reserved 4;
  bool jump = 5;
}
