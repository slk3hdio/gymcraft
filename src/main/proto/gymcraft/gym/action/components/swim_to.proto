syntax = "proto3";

package gymcraft.gym.action;

option java_multiple_files = true;
option java_package = "io.github.mousemeya.gymcraft.gym.action.proto";
option java_outer_classname = "SwimToProto";

// 使用两栖寻路移动到目标方块：可在水中、水面与陆地之间规划路径，
// 陆地表现与 move_to 一致，是 move_to 的水域增强变体。
// 坐标按方块位置解释，实际导航目标统一修正为该方块中心的可站立位置
// （x/z 半格中心、y 为方块底部），整数坐标不再是四块交界的边角。
message ProtoSwimTo {
  double x = 1;
  double y = 2;
  double z = 3;
  // 到达判定为三维欧氏距离：与修正后目标的直线距离不大于该值即完成
  //（服务端实际判定至少取 0.1 格物理容差）。
  double stop_distance = 4;
}
