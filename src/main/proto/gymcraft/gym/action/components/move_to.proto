syntax = "proto3";

package gymcraft.gym.action;

option java_multiple_files = true;
option java_package = "io.github.mousemeya.gymcraft.gym.action.proto";
option java_outer_classname = "MoveToProto";

message ProtoMoveTo {
  // 目标方块坐标；实际导航目标按原版 findSurfacePosition 语义修正为可站立位置
  // （x/z 半格中心、y 为该格底部）：实心方块上移到其上方第一个可站面、空气格
  // 吸附到下方支撑面、液体等非固体格保持原格。发生修正时完成 description 携带
  // 提示，details 的 target_correction 报告修正码、requested 报告原始请求坐标。
  double x = 1;
  double y = 2;
  double z = 3;
  // 到达判定为三维欧氏距离：与修正后目标的直线距离不大于该值即完成
  //（服务端实际判定至少取 0.1 格物理容差）。
  double stop_distance = 4;
}
