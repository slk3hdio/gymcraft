syntax = "proto3";

package gymcraft.gym.action;

option java_multiple_files = true;
option java_package = "io.github.mousemeya.gymcraft.gym.action.proto";
option java_outer_classname = "SetBlockProto";

message ProtoSetBlock {
  int32 x = 1;
  int32 y = 2;
  int32 z = 3;
  // 方块描述, 与 /setblock 语法一致: "minecraft:stone" 或 "minecraft:oak_stairs[facing=north]", 可带 {nbt}
  string block = 4;
}
