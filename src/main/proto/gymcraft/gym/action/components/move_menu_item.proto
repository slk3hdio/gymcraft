syntax = "proto3";

package gymcraft.gym.action;

option java_multiple_files = true;
option java_package = "io.github.mousemeya.gymcraft.gym.action.proto";
option java_outer_classname = "MoveMenuItemProto";

// 同一会话内顺序执行，失败停止且不回滚。
message ProtoMoveMenuItem {
  uint64 session_id = 1;
  reserved 2 to 5;
  repeated Move moves = 6;
}

// 单项移动；repeat 为 0 或 1 时执行一次。
message Move {
  int32 source_slot_id = 1;
  int32 target_slot_id = 2;
  int32 count = 3;
  int32 repeat = 4;
}
