syntax = "proto3";

package gymcraft.gym.action;

import "google/protobuf/any.proto";

option java_multiple_files = true;
option java_package = "io.github.mousemeya.gymcraft.gym.action.proto";
option java_outer_classname = "ActionProto";

message ProtoMcAction {
  map<string, google.protobuf.Any> components = 1;  // 键为组件注册id
  // 动作级超时（秒），<= 0 表示不限制。RUNNING 动作超过该时长仍未产生终态时，
  // 运行时按 20 tick/秒换算并中断组件，以 failed 终态返回。
  float timeout_seconds = 2;
}

