syntax = "proto3";

package gymcraft.gym.action;

import "google/protobuf/any.proto";

option java_multiple_files = true;
option java_package = "io.github.mousemeya.gymcraft.gym.action.proto";
option java_outer_classname = "ActionProto";

message ProtoMcAction {
  reserved 1, 2;
  reserved "components", "timeout_seconds";

  // 单个 action 严格只承载一个组件：注册 ID 与对应 protobuf 负载。
  string component_id = 3;
  google.protobuf.Any payload = 4;
}
