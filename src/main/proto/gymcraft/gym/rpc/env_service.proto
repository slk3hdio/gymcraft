syntax = "proto3";

package gymcraft.gym.rpc;

import "gymcraft/gym/action/action.proto";
import "gymcraft/gym/observation/observation.proto";

option java_multiple_files = true;
option java_package = "io.github.mousemeya.gymcraft.gym.rpc.proto";
option java_outer_classname = "EnvServiceProto";

service GymEnvService {
  rpc Connect(ConnectRequest) returns (ConnectResponse);
  rpc Reset(ResetRequest) returns (ResetResponse);
  rpc Step(StepRequest) returns (StepResponse);
  rpc CloseSession(CloseSessionRequest) returns (CloseSessionResponse);
  rpc ListEnvironments(ListEnvironmentsRequest) returns (ListEnvironmentsResponse);
}

message ConnectRequest {
  string entity_uuid = 1;
}

message ConnectResponse {
  string session_id = 1;
  string entity_uuid = 2;
  string metadata = 3;
  string action_space_json = 4;
  string observation_space_json = 5;
}

message ResetRequest {
  string session_id = 1;
  optional int32 seed = 2;
  string options = 3;
}

message ResetResponse {
  gymcraft.gym.observation.ProtoMcObservation observation = 1;
  string info = 2;
}

message StepRequest {
  string session_id = 1;
  reserved 2;
  reserved "action";

  // 按列表顺序串行执行；空列表视为一次 noop。
  repeated gymcraft.gym.action.ProtoMcAction actions = 3;
  // 整个 step 共享的超时（秒），<= 0 表示不限制。
  float timeout_seconds = 4;
}

message StepResponse {
  gymcraft.gym.observation.ProtoMcObservation observation = 1;
  double reward = 2;
  bool terminated = 3;
  bool truncated = 4;
  string info = 5; // 详细信息的JSON字符串表示
}

message CloseSessionRequest {
  string session_id = 1;
}

message CloseSessionResponse {
  bool closed = 1;
}

message ListEnvironmentsRequest {
}

// 单个已注册环境的概要信息。
message EnvironmentInfo {
  // 环境绑定的受控实体 UUID，可直接用于 Connect
  string entity_uuid = 1;
  // 环境注册 ID（如 gymcraft:simple_mob）
  string env_type = 2;
  // 是否已被活跃 RPC 会话占用（true 时 Connect 返回 ALREADY_EXISTS）
  bool connected = 3;
}

message ListEnvironmentsResponse {
  repeated EnvironmentInfo environments = 1;
}
