syntax = "proto3";

package gymcraft.gym.observation;

import "gymcraft/gym/observation/common/item_stack_view.proto";

option java_multiple_files = true;
option java_package = "io.github.mousemeya.gymcraft.gym.observation.proto";
option java_outer_classname = "SelfStateProto";

message ProtoSelfState {
  string entity_type = 1;
  string uuid = 2;
  double health = 3;
  double max_health = 4;
  double x = 5;
  double y = 6;
  double z = 7;
  double vx = 8;
  double vy = 9;
  double vz = 10;
  float yaw = 11;
  float pitch = 12;
  bool on_ground = 13;
  bool in_water = 14;
  bool in_lava = 15;
  bool alive = 16;
  bool navigating = 17;
  bool at_target = 18;
  int32 target_entity_id = 19;
  string control_mode = 20;
  // 主手持物；空手时不设置该字段（与 menu 观测空槽不设置 item 的语义一致）。
  ProtoItemStackView main_hand_item = 21;
}
