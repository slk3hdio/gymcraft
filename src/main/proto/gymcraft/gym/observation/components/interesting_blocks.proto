syntax = "proto3";

package gymcraft.gym.observation;

import "gymcraft/gym/observation/common/block_view.proto";

option java_multiple_files = true;
option java_package = "io.github.mousemeya.gymcraft.gym.observation.proto";
option java_outer_classname = "InterestingBlocksProto";

message ProtoInterestingBlocks {
  repeated ProtoBlockView blocks = 1;
}
