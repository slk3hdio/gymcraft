syntax = "proto3";

package gymcraft.gym.observation;

option java_multiple_files = true;
option java_package = "io.github.mousemeya.gymcraft.gym.observation.proto";
option java_outer_classname = "ItemStackViewProto";

// 纯物品数据：槽位身份由外层 ProtoSlotView.slot_id 表达；
// nbt 为服务端统一生成的规范化 SNBT，没有标签时为空字符串；空槽不设置 item。
message ProtoItemStackView {
  string item_id = 1;
  int32 count = 2;
  reserved 3, 4;
  string nbt = 5;
}
