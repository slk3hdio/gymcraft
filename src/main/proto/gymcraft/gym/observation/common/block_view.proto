syntax = "proto3";

package gymcraft.gym.observation;

option java_multiple_files = true;
option java_package = "io.github.mousemeya.gymcraft.gym.observation.proto";
option java_outer_classname = "BlockViewProto";

message ProtoBlockView {
  int32 x = 1;
  int32 y = 2;
  int32 z = 3;
  string block_id = 4;
  double distance = 5;
}
