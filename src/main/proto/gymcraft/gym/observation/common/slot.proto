syntax = "proto3";

package gymcraft.gym.observation;

import "gymcraft/gym/observation/common/item_stack_view.proto";

option java_multiple_files = true;
option java_package = "io.github.mousemeya.gymcraft.gym.observation.proto";
option java_outer_classname = "SlotProto";

// 菜单和背包共用的槽位模型
message ProtoSlotView {
  int32 slot_id = 1;
  string category = 2;
  ProtoItemStackView item = 3;
  int32 x = 4;
  int32 y = 5;
}
