[build-system]
requires = ["setuptools>=75", "grpcio-tools>=1.81.1"]
build-backend = "setuptools.build_meta"

[project]
name = "gymcraft"
version = "1.0.0" # 这里和模组版本号保持一致
description = "Python RPC client for GymCraft - Gymnasium-style RL environments in Minecraft"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "grpcio>=1.81.1",
    "gymnasium>=1.3.0",
    "mypy>=2.1.0",
    "protobuf>=6.33.6",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["gymcraft", "gymcraft.*"]

[tool.mypy]
python_version = "3.11"
files = ["src/gymcraft", "examples"]
exclude = ["src/gymcraft/gym/"]

warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true

disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true

no_implicit_optional = true
strict_equality = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = [
  "gymcraft.gym.*",
]
follow_imports = "skip"
ignore_errors = true

[[tool.mypy.overrides]]
module = [
  "grpc.*",
  "gymnasium.*",
  "google.*",
]
ignore_missing_imports = true

