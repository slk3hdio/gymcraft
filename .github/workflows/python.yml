name: Python

on:
  push:
    branches: [master]
  pull_request:

jobs:
  typecheck-and-package:
    name: Typecheck and package Python client
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: src/main/python/uv.lock

      - name: Generate Python gRPC stubs
        run: ./gradlew generatePythonStubs

      - name: Typecheck Python code
        working-directory: src/main/python
        run: uv run mypy src examples

      - name: Package Python client
        run: ./gradlew packagePython

      - name: Upload Python distributions
        uses: actions/upload-artifact@v4
        with:
          name: gymcraft-python-dist
          path: dist/*
          if-no-files-found: error
