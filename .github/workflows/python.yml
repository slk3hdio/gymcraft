name: Python

on:
  push:
    branches: [master]
  pull_request:
  # 发布 GitHub Release 时，先执行检查和打包，再上传 PyPI。
  release:
    types: [published]

permissions:
  contents: read

jobs:
  typecheck-and-package:
    name: Typecheck and package Python client
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: src/main/python/uv.lock

      - name: Grant gradlew execute permission
        run: chmod +x gradlew

      - name: Generate Python gRPC stubs
        run: ./gradlew generatePythonStubs

      - name: Typecheck Python code
        working-directory: src/main/python
        run: uv run mypy src debug tests

      - name: Test Python LLM tools
        working-directory: src/main/python
        run: uv run python -m unittest discover -s tests -v

      - name: Package Python client
        run: ./gradlew packagePython

      - name: Upload Python distributions
        uses: actions/upload-artifact@v4
        with:
          name: gymcraft-python-dist
          path: dist/*
          if-no-files-found: error

  # 发布任务只下载已验证的构建产物，并通过 OIDC 获取短期凭据。
  publish:
    name: Publish Python client to PyPI
    if: github.event_name == 'release'
    needs: typecheck-and-package
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/gymcraft
    permissions:
      id-token: write

    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@v4
        with:
          name: gymcraft-python-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # 不同 MC 发行版共享同一 Python 版本，已上传的分发文件直接跳过。
          skip-existing: true
